name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,        os: ubuntu-latest,       target: x86_64-unknown-linux-gnu,  bin: zegion }
          - { name: linux-aarch64,       os: ubuntu-24.04-arm,    target: aarch64-unknown-linux-gnu, bin: zegion }
          - { name: windows-x86_64,      os: windows-latest, target: x86_64-pc-windows-msvc,    bin: zegion.exe }
          - { name: macos-x86_64,        os: macos-latest,   target: x86_64-apple-darwin,       bin: zegion }
          - { name: macos-aarch64,       os: macos-latest,   target: aarch64-apple-darwin,      bin: zegion }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }} --bin zegion

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=target/${{ matrix.target }}/release/${{ matrix.bin }}
          NAME=zegion-${{ matrix.name }}
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a dist/$NAME.zip "$BIN"
          else
            tar -czf dist/$NAME.tar.gz -C target/${{ matrix.target }}/release ${{ matrix.bin }}
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: zegion-${{ matrix.name }}
          path: dist/*
          retention-days: 14

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zegion-*
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          echo "Artifacts:"; ls -la
          FILES=$(ls zegion-*.tar.gz zegion-*.zip)
          echo "Uploading: $FILES"
          gh release create "$TAG" --title "Zegion $TAG" --generate-notes $FILES
